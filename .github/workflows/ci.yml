name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mistral-clone/web typecheck
      - run: pnpm --filter @mistral-clone/web build
      - run: node scripts/compare-baseline.mjs

  legal:
    runs-on: ubuntu-latest
    needs: boundaries
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @mistral-clone/legal typecheck
      - run: pnpm --filter @mistral-clone/legal build
      - run: pnpm verify --app legal --tier 2
        env:
          CLONE: http://127.0.0.1:4323
